name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc-13, clang-17]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.compiler }}" = "gcc-13" ]; then
            sudo apt-get install -y g++-13
          else
            sudo apt-get install -y clang-17
          fi

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "gcc-13" ]; then
            export CXX=g++-13
          else
            export CXX=clang++-17
          fi
          cmake --preset full -DCMAKE_CXX_COMPILER=$CXX

      - name: Build
        run: cmake --build --preset full

      - name: Test
        run: ctest --preset full --output-on-failure

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset full

      - name: Build
        run: cmake --build --preset full --config Debug

      - name: Test
        run: ctest --preset full --output-on-failure -C Debug
