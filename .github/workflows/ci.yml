name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
            packages: g++-14
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
            packages: clang-18
    name: Linux (${{ matrix.compiler }})
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.packages }}

      - name: Configure
        run: |
          cmake --preset full \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build --preset full

      - name: Test
        run: ctest --preset full --output-on-failure

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset full

      - name: Build
        run: cmake --build --preset full --config Debug

      - name: Test
        run: ctest --preset full --output-on-failure -C Debug
